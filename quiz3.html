let current = 0;
let points = 0;
let timeLeft = 15;
let timerId = null;
let locked = false;

const questionEl = document.getElementById("question");
const optionsEl = document.getElementById("options");
const feedbackEl = document.getElementById("feedback");
const scoreEl = document.getElementById("score");
const progressEl = document.getElementById("progress");
const timerEl = document.getElementById("timer");
const nextBtn = document.getElementById("nextBtn");
const restartBtn = document.getElementById("restartBtn");

function showQuestion() {
  clearInterval(timerId);
  locked = false;
  timeLeft = 15;

  feedbackEl.textContent = "";
  nextBtn.style.display = "inline-block";
  nextBtn.disabled = false;
  nextBtn.textContent = "अगला प्रश्न ➜";

  const item = questions[current];
  questionEl.textContent = item.q;
  progressEl.textContent =
    `प्रश्न ${current + 1} / ${questions.length}`;

  optionsEl.innerHTML = "";

  item.options.forEach((option, index) => {
    const button = document.createElement("button");
    button.textContent =
      `${String.fromCharCode(65 + index)}. ${option}`;
    button.onclick = () => checkAnswer(index);
    optionsEl.appendChild(button);
  });

  updateScore();
  updateTimer();

  timerId = setInterval(() => {
    timeLeft--;
    updateTimer();

    if (timeLeft <= 0) {
      clearInterval(timerId);
      if (!locked) {
        locked = true;
        disableOptions();
        feedbackEl.textContent =
          "⏰ समय समाप्त! " + item.explain;
      }
    }
  }, 1000);
}

function updateTimer() {
  timerEl.textContent = `⏱️ समय: ${timeLeft} सेकंड`;
}

function checkAnswer(index) {
  if (locked) return;

  locked = true;
  clearInterval(timerId);

  const item = questions[current];
  const buttons = optionsEl.querySelectorAll("button");

  if (index === item.answer) {
    points++;
    feedbackEl.textContent = "✅ सही उत्तर! " + item.explain;
  } else {
    feedbackEl.textContent =
      "❌ गलत उत्तर! सही उत्तर: " +
      item.options[item.answer] + ". " + item.explain;
  }

  buttons.forEach((button, i) => {
    button.disabled = true;

    if (i === item.answer) {
      button.style.background = "#9cf6b0";
    } else if (i === index) {
      button.style.background = "#ffaaaa";
    }
  });

  updateScore();
}

function disableOptions() {
  optionsEl.querySelectorAll("button").forEach(button => {
    button.disabled = true;
  });
}

function updateScore() {
  scoreEl.textContent = `स्कोर: ${points} / ${questions.length}`;
}

function nextQuestion() {
  if (current < questions.length - 1) {
    current++;
    showQuestion();
  } else {
    finishQuiz();
  }
}

function finishQuiz() {
  clearInterval(timerId);
  locked = true;
  questionEl.textContent = "🎉 टेस्ट पूरा हुआ!";
  optionsEl.innerHTML = "";
  feedbackEl.textContent =
    `आपका अंतिम स्कोर ${points} / ${questions.length} है।`;
  progressEl.textContent = "परिणाम";
  timerEl.textContent = "समय समाप्त";
  nextBtn.style.display = "none";
}

function restartQuiz() {
  clearInterval(timerId);
  current = 0;
  points = 0;
  showQuestion();
}

restartBtn.style.display = "inline-block";
showQuestion();
</script>
